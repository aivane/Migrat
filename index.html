    <!-- Google Fonts — Sarabun is the global body font (see src/style.css / tailwind font-sans below);
         Prompt is required separately by src/assets/fundinfo.css (--font-main and most fundinfo.* rules
         still hardcode 'Prompt') — dropping it here silently falls back to a generic sans-serif since the
         font file never loads, even though the CSS rule still says 'Prompt'. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CDN — required by fundinfo components (src/components/fundinfo/**), do not remove -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f5ff',
                100: '#e5edff',
                200: '#cddbfe',
                300: '#b4c6fc',
                400: '#8da2fb',
                500: '#1c52d8',
                600: '#1441b4',
                700: '#0e318f',
                800: '#0a2366',
                900: '#0b1942'
              }
            },
            fontFamily: {
              sans: ['Sarabun', '"Noto Sans Thai"', 'Inter', 'system-ui', 'sans-serif'],
              brand: ['Sarabun', '"Noto Sans Thai"', 'sans-serif'],
              num: ['Inter', 'Sarabun', 'sans-serif']
            }
          }
        }
      }
    </script>
